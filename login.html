<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TerraLink Admin Console - Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300..800&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .login-overlay {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0c0a09 0%, #1c1917 100%);
      padding: 24px;
    }
    .login-card {
      background: #fff;
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.3);
      border: 1px solid var(--border);
    }
    .login-card h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 4px;
      letter-spacing: -0.02em;
    }
    .login-card .lede {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      margin-top: 32px;
    }
    .login-card label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .login-card input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px;
      font-family: inherit;
      margin-bottom: 16px;
      outline: none;
      transition: all 0.2s ease;
    }
    .login-card input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(194, 65, 12, 0.08);
    }
    .login-card .err {
      color: var(--error);
      font-size: 13px;
      margin-bottom: 12px;
      min-height: 20px;
    }
    .login-card button {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .login-card button:hover {
      background: var(--primary-hover);
    }
    .login-card button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .login-card .meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 20px;
      text-align: center;
      line-height: 1.6;
    }
    .login-card .meta code {
      font-family: 'JetBrains Mono', monospace;
      background: var(--bg);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
    }
    .mfa-section {
      display: none;
      animation: fadeIn 0.3s ease;
      padding-top: 24px;
      margin-bottom: 48px;
    }
    .mfa-section .lede {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      margin-top: 48px;
    }
    .mfa-section.visible {
      display: block;
    }
    .login-section {
      display: block;
    }
    .login-section.hidden {
      display: none;
    }
    .mfa-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      background: var(--bg);
      border-radius: 50%;
      margin: 0 auto 16px auto;
    }
    .mfa-icon span {
      font-size: 24px;
      color: var(--primary);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 80px;
    height: 80px;
    background: var(--primary);
    border-radius: 50%;
    margin: 0 auto 16px;
    }
    .login-icon span {
      font-size: 24px;
      color: var(--primary);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
  </style>
</head>
<body>
  <div class="login-overlay">
    <form class="login-card" id="loginForm" autocomplete="on">
      <div class="login-icon">
        <span class="material-symbols-outlined"><img src="assets/Logo.svg" alt="Lock" /></span>
      </div>

      <div style="text-align:center;margin-bottom:8px;color: var(--primary);">
        <h2>Terralink</h2>
      </div>

      <p class="lede" id="loginLede">Sign in to the admin console.</p>

      <div class="login-section" id="loginSection">
        <label>Identifier</label>
        <input type="text" id="loginIdentifier" autocomplete="username" required placeholder="Username, email, or employee no." />

        <label>Password</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required placeholder="••••••••" />

        <p class="err" id="loginError"></p>
        <button type="submit" id="loginButton">Sign in</button>
      </div>

      <div class="mfa-section" id="mfaSection">
        <div class="mfa-icon">
          <span class="material-symbols-outlined"><img src="assets/Mobile Phone_Monochromatic.svg" alt="Mobile" /></span>
        </div>
        <p class="lede" style="text-align:center;">Enter the 6-digit code from your authenticator app.</p>

        <label>MFA Code</label>
        <input type="text" id="mfaCode" name="mfaCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" autocomplete="one-time-code" />

        <p class="err" id="mfaError"></p>
        <button type="submit" id="mfaButton">Verify</button>
        <button type="button" id="mfaBack" style="background:transparent;color:var(--text-secondary);margin-top:8px;">Back to login</button>
      </div>
    </form>
  </div>

  <script>
    (function () {
      'use strict';

      var API_BASE = 'http://localhost:5031';
      var mfaToken = null;

      function $(id) { return document.getElementById(id); }

      function setError(msg) {
        var el = $('loginError');
        if (el) el.textContent = msg;
        var btn = $('loginButton');
        if (btn) { btn.disabled = false; btn.textContent = 'Sign in'; }
        var mfaErr = $('mfaError');
        if (mfaErr) mfaErr.textContent = '';
      }

      function setMfaError(msg) {
        var el = $('mfaError');
        if (el) el.textContent = msg;
        var btn = $('mfaButton');
        if (btn) { btn.disabled = false; btn.textContent = 'Verify'; }
      }

      function setLoading() {
        var errEl = $('loginError');
        if (errEl) errEl.textContent = '';
        var btn = $('loginButton');
        if (btn) { btn.disabled = true; btn.textContent = 'Signing in\u2026'; }
      }

      function setMfaLoading() {
        var errEl = $('mfaError');
        if (errEl) errEl.textContent = '';
        var btn = $('mfaButton');
        if (btn) { btn.disabled = true; btn.textContent = 'Verifying\u2026'; }
      }

      var baseEl = $('apiBaseLabel');
      if (baseEl) baseEl.textContent = API_BASE;

      var Storage = {
        KEY: 'terralink_auth',
        get: function () {
          try { return JSON.parse(localStorage.getItem(this.KEY)); } catch (e) { return null; }
        },
        set: function (data) { localStorage.setItem(this.KEY, JSON.stringify(data)); },
        clear: function () { localStorage.removeItem(this.KEY); }
      };

      var existing = Storage.get();
      if (existing && existing.token) {
        window.location.href = 'index.html';
        return;
      }

      function showMfa() {
        $('loginSection').classList.add('hidden');
        $('mfaSection').classList.add('visible');
        $('loginLede').textContent = 'Two-factor authentication required.';
        $('loginLede').style.color = 'var(--text-secondary)';
        $('loginLede').style.fontWeight = '600';
        $('loginLede').style.justifySelf = 'center';
        $('mfaCode').focus();
      }

      function showLogin() {
        $('loginSection').classList.remove('hidden');
        $('mfaSection').classList.remove('visible');
        $('loginLede').textContent = 'Sign in to the admin console.';
        mfaToken = null;
        $('loginError').textContent = '';
        $('mfaError').textContent = '';
      }

      $('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();

        if (mfaToken) {
          var code = ($('mfaCode') || {}).value || '';
          if (!code || code.length !== 6) {
            setMfaError('Please enter the 6-digit code.');
            return;
          }
          setMfaLoading();

          fetch(API_BASE + '/api/auth/mfa/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mfaToken: mfaToken, code: code })
          })
          .then(function (res) {
            console.log('[MFA] Verify status:', res.status);
            return res.json().then(function (data) {
              console.log('[MFA] Verify response:', JSON.stringify(data));
              if (res.status === 400) {
                var msg = (data && data.message) ? data.message : 'Invalid MFA code.';
                throw new Error(msg);
              }
              if (!res.ok) {
                var msg = (data && data.message) ? data.message : 'Verification failed.';
                throw new Error(msg);
              }
              return data;
            });
          })
          .then(function (data) {
            var token = data.accessToken;
            var user = {
              id: data.user && data.user.id,
              employeeNo: (data.user && data.user.employeeNo) || 'Admin',
              roleName: (data.user && data.user.roleName) || 'Admin',
            };
            Storage.set({ token: token, user: user });
            window.location.href = 'index.html';
          })
          .catch(function (err) {
            setMfaError(err && err.message ? err.message : 'Verification failed.');
          });
          return;
        }

        setLoading();

        var identifier = ($('loginIdentifier') || {}).value || '';
        var password = ($('loginPassword') || {}).value || '';

        if (!identifier || !password) {
          setError('Please enter both identifier and password.');
          return;
        }

        fetch(API_BASE + '/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier: identifier, password: password })
        })
        .then(function (res) {
          if (res.status === 401) {
            return res.json().then(function (data) {
              var msg = (data && data.message) ? data.message : 'Invalid credentials.';
              throw new Error(msg);
            }).catch(function (err) {
              if (err instanceof Error) throw err;
              throw new Error('Invalid credentials.');
            });
          }
          if (res.status === 403) {
            throw new Error('Account is inactive.');
          }
          if (!res.ok) {
            return res.json().then(function (data) {
              var msg = (data && data.message) ? data.message : 'Sign-in failed.';
              throw new Error(msg);
            }).catch(function () {
              throw new Error('Sign-in failed: HTTP ' + res.status);
            });
          }
          return res.json();
        })
        .then(function (data) {
          console.log('[Login] Response data:', JSON.stringify(data));
          console.log('[Login] mfaRequired:', data.mfaRequired, 'mfaToken:', !!data.mfaToken);
          var isMfa = (data.mfaRequired || data.MfaRequired) && (data.mfaToken || data.MfaToken);
          console.log('[Login] isMfa:', isMfa);
          if (isMfa) {
            console.log('[Login] MFA required, showing MFA form');
            mfaToken = data.mfaToken || data.MfaToken;
            showMfa();
            return;
          }
          console.log('[Login] Normal login flow');
          var token = data.accessToken;
          var user = {
            id: data.user && data.user.id,
            employeeNo: (data.user && (data.user.employeeNo || data.user.username)) || 'Admin',
            roleName: (data.user && data.user.roleName) || 'Admin'
          };
          Storage.set({ token: token, user: user });
          window.location.href = 'index.html';
        })
        .catch(function (err) {
          setError(err && err.message ? err.message : 'Sign-in failed.');
        });
      });

      $('mfaBack').addEventListener('click', function () {
        showLogin();
      });
    })();
  </script>
</body>
</html>
