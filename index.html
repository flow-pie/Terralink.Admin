<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TerraLink Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300..800&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand" onclick="window.TERRA.router.navigate('dashboard')">
        <div class="sidebar-logo">T</div>
        <div class="sidebar-brand-text">
          <h1>TerraLink </h1>
          <p class="sidebar-subtitle">Admin Console</p>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-footer-avatar">
          <img id="sidebar-avatar" src="" alt="Admin" />
        </div>
        <div class="sidebar-footer-info">
          <h4 id="sidebar-name">Administrator</h4>
          <p id="sidebar-role">Admin</p>
        </div>
      </div>
    </aside>

    <!-- Header -->
    <header class="header">
      <div class="header-search">
        <span class="material-symbols-outlined">search</span>
        <input type="text" id="global-search" placeholder="Search borrowers, loans, transactions..." />
      </div>
      <div class="header-actions">
        <button class="profile-btn" id="btn-profile">
          <div class="profile-info">
            <div class="profile-name" id="profile-name">Administrator</div>
            <div class="profile-role" id="profile-role">Admin</div>
          </div>
          <div class="profile-avatar">
            <img id="profile-avatar" src="" alt="Profile" />
          </div>
        </button>
      </div>
    </header>

    <!-- Main -->
    <main class="main">
      <div class="screen" id="screen">
        <div id="loading-indicator" style="display:flex;align-items:center;justify-content:center;height:200px;color:var(--text-muted);">
          <div style="text-align:center;">
            <span class="material-symbols-outlined" style="font-size:48px;animation:ping 1.5s ease-in-out infinite;">sync</span>
            <p style="margin-top:12px;font-size:13px;">Loading dashboard…</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Modal Container -->
  <div id="modal-container"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/router.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/borrowers.js"></script>
  <script src="js/pages/officers.js"></script>
  <script src="js/pages/loans.js"></script>
  <script src="js/pages/repayments.js"></script>
  <script src="js/pages/audit.js"></script>
  <script src="js/app.js"></script>
  <script>
    window.onerror = function(msg, url, line) {
      console.error('[Global Error]', msg, 'at', url + ':' + line);
      var screen = document.getElementById('screen');
      if (screen && screen.innerHTML.trim().length === 0) {
        screen.innerHTML = '<div class="card" style="text-align:center;padding:60px;color:var(--error);"><h2>JavaScript Error</h2><p style="color:var(--text-secondary);margin-top:8px;">' + msg + '</p><p style="color:var(--text-muted);font-size:12px;font-family:JetBrains Mono,monospace;">' + url + ':' + line + '</p><p style="color:var(--text-muted);font-size:12px;margin-top:8px;">Check browser console (F12) for full error details.</p></div>';
      }
      return false;
    };
  </script>
</body>
</html>
